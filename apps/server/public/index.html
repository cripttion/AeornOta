<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Aeron Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%230b6a85' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%230b6a85'/%3E%3C/svg%3E">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar" hidden></button>
    <a class="brand" href="#/overview"><span class="mark" aria-hidden="true"></span>Aeron</a>
    <span class="server" id="server" title="The Aeron server this dashboard controls"></span>
    <div class="top-right">
      <button type="button" class="icon-btn" id="help-btn" aria-label="Help for this page" hidden></button>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="Theme"></button>
      <span class="who" id="who"></span>
      <button type="button" class="icon-btn" id="logout" hidden></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Main" hidden></nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
